name: checks

# One job: run the SAME command developers run locally, so local-green and
# CI-green can never disagree. CI adds no checks of its own — tools.checks is
# the single source of truth (the suite, all four structural gates, the orphan
# gate, the coverage ratchet and the boot smoke).
on:
  push:
  pull_request:
  # Manual trigger. Added 2026-08-25: this repo is a fork created that day,
  # and GitHub does not run a fork's workflows until Actions is enabled on it
  # by hand -- so there was no way to ask for a run at all. With this, the
  # Actions tab gets a "Run workflow" button once that is done.
  workflow_dispatch:

# One run per ref; cancel a superseded run so two suites never race (CLAUDE.md:
# two full suites at once produce phantom failures).
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows to match the dev + production environment (MetaTrader5 is a win32
    # dependency; the suite fakes MT5 and never connects a terminal).
    runs-on: windows-latest
    # 60, raised from 30 on 2026-08-27 as a DIAGNOSTIC, not a fix.
    #
    # The first run this repo ever completed (33102563650) passed all six fast
    # gates on Windows and was then killed at 30m00s with the suite still
    # running. It had been in pytest for 28 minutes; the same suite takes 239
    # seconds locally on macOS.
    #
    # We do not yet know whether that is slow or hung, and the two need
    # different fixes. Boot smoke was only 1.7x slower than local (5.2s vs
    # 3.1s), so the runner is not uniformly 7x slower -- but every test builds
    # and deletes its own temp SQLite file via the fresh_db fixture, and
    # thousands of file create/delete cycles past Windows Defender is a known
    # pathological case.
    #
    # If a run completes inside 60, the number it reports is the real cost and
    # this becomes a decision about optimising the suite. If it times out
    # again, something hangs and raising this further is the wrong answer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test runner deps — requirements.txt is runtime-only (ships in the
          # installer). Without these every run died at "No module named
          # pytest" before testing anything (2026-08-11 review C3).
          pip install pytest pytest-cov pytest-asyncio

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: frontend

      - name: Run all checks
        run: python -m tools.checks all

      - name: Type-check and test the dashboard
        run: |
          npm run lint
          npm test
        working-directory: frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: .coverage.json
          # .coverage.json is a DOTFILE, and upload-artifact v4 skips hidden
          # files unless told otherwise. Without this the step ran green on
          # every build and uploaded nothing -- "No files were found with the
          # provided path", a warning, never a failure. Found 2026-09-02 while
          # trying to read the coverage data to diagnose a Windows-only floor
          # failure, and discovering there had never been any to read.
          include-hidden-files: true
          if-no-files-found: ignore
          # (kept on v4 deliberately — bump majors one at a time so a broken
          # action version is attributable; the checkout/setup-python bumps
          # silence the Node 20 deprecation warnings)

  # The bundle check is its own job, on macOS, and the reason is measured
  # rather than assumed (2026-09-19).
  #
  # frontend/dist is committed and is what the app serves, so a source change
  # that was not rebuilt ships the previous dashboard. This check is what makes
  # that impossible to forget. It works by rebuilding and diffing, and asset
  # names are content-hashed, so any real change moves them.
  #
  # It used to be a step in the Windows job, and it failed there on a tree
  # whose dist WAS current. The bundle Windows builds is genuinely ~30 bytes
  # different from the one macOS builds: 773.45 kB against 773.42 kB, a
  # different content hash, from identical source. Everything else was ruled
  # out first -- same Node 22, same package-lock via `npm ci`, source converted
  # to CRLF locally (no change to the output), and a build from a completely
  # different absolute path (no change either, so no path leaks into the
  # bundle). What is left is that esbuild and rollup ship a NATIVE BINARY PER
  # PLATFORM -- @esbuild/win32-x64 and @rollup/rollup-win32-x64-msvc against
  # the darwin-arm64 pair -- and the same version of those binaries does not
  # emit byte-identical output on both.
  #
  # So byte equality across operating systems is not a property this toolchain
  # has, and a check that asserted it was testing the runner, not the commit.
  # The check itself is unchanged and not weakened: it still rebuilds from
  # source and still fails on any diff. It just runs on ONE platform, the one
  # dist is committed from, which is the only way the comparison means
  # anything. If dist ever starts being committed from another OS, this job's
  # runner has to move with it.
  #
  # Splitting it out also means bundle staleness is reported in about two
  # minutes instead of behind a forty-minute Windows suite.
  bundle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: frontend

      - name: The committed bundle must match the source
        # Explicit, though this job's runner defaults to bash: the script uses
        # a line-continuation backslash and `|| { ...; }`, and the contract
        # pinned by tests/refactor/test_ci_workflow.py is that a step writing
        # bash asks for bash. On 2026-09-18 that exact syntax under PowerShell
        # reported a stale bundle when dist was byte-identical.
        shell: bash
        run: |
          npm run build
          git diff --exit-code --stat -- dist \
            || { echo "::error::frontend/dist is stale — run 'npm run build' in frontend/ and commit the result"; exit 1; }
        working-directory: frontend
