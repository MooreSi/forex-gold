[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forex-trader"
version = "1.0.0"
description = "FOREX Trader — XAUUSD Gold Simulation App with NiceGUI"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=1.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "anthropic>=0.36.0",
    "telethon>=1.36.0",
    "PyYAML>=6.0",
]

[project.scripts]
forex-trader = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forex_trader*", "backend*", "frontend*"]

[tool.pytest.ini_options]
# The suite reads the real clock: dpm_engine.detect_session() branches on the
# current UTC hour and is_weekly_market_closed() returns True all weekend, so
# every session-gated test passes on a Tuesday afternoon and fails on a Saturday
# night with no code change in between. That made "did my change break this?"
# unanswerable depending on the day.
#
# This plugin pins both readers to a fixed market-open instant so a run means
# the same thing whenever it happens. Override the instant with
# --market-clock=..., or drop the flag to reproduce real-clock behaviour.
addopts = "-p tools.testing.fixed_clock"
# frontend/ has its own suite since Phase 1; both must run by default.
testpaths = ["tests", "frontend/tests"]
